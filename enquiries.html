            <td>
                <section>
                <h1>Property Enquiry Form</h1>
                <form action="" method="post">
                    <p>
                        <label for="fullname"><b>Full Name</b></label><br>
                        <input type="text" id="fullname" name="fullname" size="40" required>
                    </p>
                    <p>
                       <label for="email"><b>Email Address</b></label><br>
                        <input type="email" id="email" name="email" size="40" required> 
                    </p>
                    <p>
                        <label for="phone"><b>Phone Number</b></label><br>
                        <input type="tel" id="phone" name="phone" size="40" required>
                    </p>
                    <p>
                        <label for="service"><b>service Required</b></label><br>
                        <select id="service" name="service">
                            <option value="buy">Property Buying</option>
                            <option value="rent">Property Rental</option>
                            <option value="management">Property Management Request</option>
                        </select>
                    </p>
                    <p>
                        <label for="message"><b>Message/ Enquiry Details:</b></label><br>
                        <textarea id="message" name="message" rows="6" cols="42" required></textarea>
                    </p>
                    <input type="submit" value=" submit Enquiry" class="btn">
                </form>
                </section>
